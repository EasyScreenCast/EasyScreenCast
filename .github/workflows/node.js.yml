name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'
    - name: Install gettext, intltool and jq
      run: |
        sudo apt-get update
        sudo apt-get install gettext intltool jq

    - run: npm ci
    - run: npm run lint

    - name: Build the extension zip
      run: make zip-file

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'
        enable-cache: true

    # EGO's review linter, fed the zip above: a bare checkout trips EGO-P-005/006
    # on files that never ship (COPYING, package-lock.json, Makefile). Advisory:
    # continue-on-error, so it reports without blocking. tree-sitter >= 0.26
    # segfaults this shexli on our files - bump the two together.
    - name: shexli
      continue-on-error: true
      run: uvx --with 'tree-sitter<0.26' shexli --format text EasyScreenCast_*.zip

    - uses: actions/upload-artifact@v7
      with:
        name: EasyScreenCast
        path: EasyScreenCast_*.zip
